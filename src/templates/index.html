<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VAE Digit Generator</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:40px 20px;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
}


@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: rgba(59, 130, 246, 0.3);
    border-radius: 50%;
    animation: float 20s infinite;
    pointer-events: none;
}

@keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

.github-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    background:#1f2937;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:14px;
    margin-bottom:20px;
    transition:0.2s;
}

.github-badge:hover{
    background:#374151;
}

.github-badge svg{
    flex-shrink:0;
}

p{
    color:#cbd5e1;
    margin-bottom:30px;
}

button{
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.container{
    max-width:900px;
    margin:auto;
    padding:0 15px;
}

/* ---------- DIGIT GALLERY ---------- */
#gallery {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
    gap: 16px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
}

#gallery img {
    width: 100%;
    aspect-ratio: 1;
    background: #1e293b;
    border-radius: 12px;
    border: 2px solid transparent;
    transition: all 0.3s ease;
    cursor: pointer;
}

#gallery img:hover {
    transform: scale(1.1);
    border-color: #3b82f6;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
}

/* ---------- VAE EXPLANATION SECTION ---------- */

.vae-demo{
    margin-top:80px;
    padding-top:40px;
    border-top:1px solid #1e293b;
}

.vae-demo h2{
    margin-bottom:20px;
}

/* ---------- CAROUSEL ---------- */

.carousel-container{
    position:relative;
    width:100%;
    max-width:1000px;
    margin:auto;
}

.carousel{
    overflow:hidden;
    border-radius:18px;
    border:2px solid #22c55e;
}

.carousel-track{
    display:flex;
    transition:transform 0.5s ease;
    image-rendering: crisp-edges;
}

.carousel-track img{
    width:100%;
    max-width:900px;
    height:auto;
    flex-shrink:0;
}

/* ---------- NAVIGATION ARROWS ---------- */

.nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#22c55e;
    font-size:28px;
    cursor:pointer;
}

.prev{ left:-50px }
.next{ right:-50px }

/* ---------- DOTS ---------- */

.dots{
    margin-top:15px;
}

.dots span{
    height:8px;
    width:8px;
    margin:5px;
    display:inline-block;
    border-radius:50%;
    background:#22c55e55;
}

.dots span.active{
    background:#22c55e;
}

/* ---------- CAPTION ---------- */

.caption{
    margin-top:15px;
    color:#22c55e;
    font-size:16px;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
}

/* ---------- CAROUSEL LIGHTBOX ---------- */

.carousel-track img{
    cursor:pointer;
}

#carouselModal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    z-index:1000;
    justify-content:center;
    align-items:center;
}

#carouselModal img{
    max-width:95%;
    max-height:95%;
    border-radius:8px;
}

#carouselModal .close-modal{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    color:white;
    cursor:pointer;
    background:none;
    border:none;
}

#carouselModal .close-modal:hover{
    color:#22c55e;
}

/* ---------- MOBILE OPTIMIZATION ---------- */

@media (max-width:600px){

    h1{
        font-size:30px;
    }

    button{
        font-size:14px;
        padding:10px 20px;
    }

    .prev{ left:10px }
    .next{ right:10px }

}

</style>

</head>

<body>

<div class="container">

<h1>MNIST Digit Generator</h1>

<a href="https://github.com/Himanshu7921/scratch-variational-autoencoder/" target="_blank" class="github-badge">
    <svg height="24" width="24" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span>View on GitHub</span>
</a>

<p>
This demo uses a Variational AutoEncoder trained on the MNIST dataset.
Click the button to generate new handwritten digits from the model's latent space.
</p>

<button onclick="generateImage()">Generate Digits</button>

<div id="gallery"></div>

<section class="vae-demo">

<h2>How VAEs Work Mathematically</h2>

<div class="carousel-container">

<button class="nav prev">❮</button>

<div class="carousel">

<div class="carousel-track">

<img src="/static/notes/note1.png">
<img src="/static/notes/note2.png">
<img src="/static/notes/note3.png">

</div>

</div>

<button class="nav next">❯</button>

</div>

<div class="caption" id="caption"></div>

<div class="dots"></div>

</section>

<!-- Carousel Lightbox Modal -->
<div id="carouselModal">
    <button class="close-modal">&times;</button>
    <img id="carouselModalImage" src="" alt="Full size note">
</div>

</div>

<script defer src="{{ url_for('static', filename='script.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</body>
</html>
