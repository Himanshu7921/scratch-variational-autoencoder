<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VAE Digit Generator</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:40px 20px;
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    margin-bottom:30px;
}

button{
    padding:12px 28px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#2563eb;
}

.container{
    max-width:900px;
    margin:auto;
    padding:0 15px;
}

/* ---------- DIGIT GALLERY ---------- */

#gallery{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(60px,1fr));
    justify-content:center;
    gap:12px;
}

#gallery img{
    width:100%;
    max-width:70px;
    background:black;
    border-radius:4px;
}

/* ---------- VAE EXPLANATION SECTION ---------- */

.vae-demo{
    margin-top:80px;
    padding-top:40px;
    border-top:1px solid #1e293b;
}

.vae-demo h2{
    margin-bottom:20px;
}

/* ---------- CAROUSEL ---------- */

.carousel-container{
    position:relative;
    width:100%;
    max-width:1000px;
    margin:auto;
}

.carousel{
    overflow:hidden;
    border-radius:18px;
    border:2px solid #22c55e;
}

.carousel-track{
    display:flex;
    transition:transform 0.5s ease;
    image-rendering: crisp-edges;
}

.carousel-track img{
    width:100%;
    max-width:900px;
    height:auto;
    flex-shrink:0;
}

/* ---------- NAVIGATION ARROWS ---------- */

.nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#22c55e;
    font-size:28px;
    cursor:pointer;
}

.prev{ left:-50px }
.next{ right:-50px }

/* ---------- DOTS ---------- */

.dots{
    margin-top:15px;
}

.dots span{
    height:8px;
    width:8px;
    margin:5px;
    display:inline-block;
    border-radius:50%;
    background:#22c55e55;
}

.dots span.active{
    background:#22c55e;
}

/* ---------- CAPTION ---------- */

.caption{
    margin-top:15px;
    color:#22c55e;
    font-size:16px;
    max-width:600px;
    margin-left:auto;
    margin-right:auto;
}

/* ---------- MOBILE OPTIMIZATION ---------- */

@media (max-width:600px){

    h1{
        font-size:30px;
    }

    button{
        font-size:14px;
        padding:10px 20px;
    }

    .prev{ left:10px }
    .next{ right:10px }

}

</style>

</head>

<body>

<div class="container">

<h1>MNIST Digit Generator</h1>

<p>
This demo uses a Variational AutoEncoder trained on the MNIST dataset.
Click the button to generate new handwritten digits from the model's latent space.
</p>

<button onclick="generateImage()">Generate Digits</button>

<div id="gallery"></div>

<section class="vae-demo">

<h2>How VAEs Work Mathematically</h2>

<div class="carousel-container">

<button class="nav prev">❮</button>

<div class="carousel">

<div class="carousel-track">

<img src="/static/notes/note1.png">
<img src="/static/notes/note2.png">
<img src="/static/notes/note3.png">

</div>

</div>

<button class="nav next">❯</button>

</div>

<div class="caption" id="caption"></div>

<div class="dots"></div>

</section>

</div>

<script defer src="{{ url_for('static', filename='script.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</body>
</html>
